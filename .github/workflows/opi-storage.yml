name: OPI storage OTLP conversion

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  conversion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: config/opi-storage/go.mod
          cache-dependency-path: config/opi-storage/go.sum
      - run: go test ./... && go vet ./...
        working-directory: config/opi-storage
